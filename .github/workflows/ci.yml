name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make mvnw executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw
      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B verify "-Dbuild.number=${{ github.run_number }}"
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify "-Dbuild.number=${{ github.run_number }}"
      - name: Run packaged JAR
        if: runner.os != 'Windows'
        run: java -jar target/lab01.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error
